name: CI

# Lightweight syntax + unit-test check on every push and PR. No market data
# needed — the unit tests run on synthetic fixtures, so this stays fast and
# deterministic. It does NOT run the full backtest (that needs the HistData M1
# set, which isn't in the repo).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all Python (syntax check)
        # Compiles every module including main.py (QuantConnect) — py_compile
        # checks syntax only, so the missing AlgorithmImports dependency is fine.
        run: python -m compileall -q backtest.py config.py main.py ict scripts live

      - name: Import core modules
        # Confirms config + backtest import cleanly (catches NameError/UnboundLocal
        # at module load — the exact class of bug that bit the P40 modulator).
        run: python -c "import config, backtest; from ict import market_structure, amd, fvg, order_block; print('core imports OK')"

      - name: Unit tests — fractal market structure
        run: python test_market_structure.py
